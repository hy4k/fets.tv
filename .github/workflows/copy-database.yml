# One-off: copies the fets.tv database (structure, data and staff logins) from
# the old Supabase project into the new one. Uploaded files are left behind.
# Needs two repository secrets, each a "Session pooler" connection string:
#   OLD_DB_URL  the old project (ueufcqmdqtwvhjjyudeu)
#   NEW_DB_URL  the new project (jnbwgctjrbqbzxuausbe)
# The dump stays on the runner: it holds candidate data, so nothing is uploaded.
name: Copy database to the new Supabase project

on:
  push:
    branches: [claude/nifty-dijkstra-xqjoje]
    paths: [.github/workflows/copy-database.yml]
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
      NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Both databases answer, and the new one is empty
        run: |
          if [ -z "$OLD_DB_URL" ] || [ -z "$NEW_DB_URL" ]; then
            echo "::error::Add OLD_DB_URL and NEW_DB_URL as repository secrets first."
            exit 1
          fi
          echo "Old project:"
          psql "$OLD_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) || ' candidates, ' || (select count(*) from auth.users) || ' logins' from public.candidates"
          tables=$(psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "New project already has $tables public tables."
          if [ "$tables" != "0" ]; then
            echo "::error::The new project is not empty; refusing to copy over it."
            exit 1
          fi

      - name: Dump the old project
        run: |
          supabase db dump --db-url "$OLD_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$OLD_DB_URL" -f schema.sql
          supabase db dump --db-url "$OLD_DB_URL" -f data.sql --use-copy --data-only -x storage.objects
          ls -la *.sql

      - name: Restore into the new project, all or nothing
        run: |
          psql --single-transaction -v ON_ERROR_STOP=1 \
            --file roles.sql \
            --file schema.sql \
            --command 'SET session_replication_role = replica' \
            --file data.sql \
            --dbname "$NEW_DB_URL"

      - name: Compare exact row counts
        run: |
          # One "table rows" line per public table, plus the logins.
          q="select format('select %L || '' '' || count(*) from public.%I;', tablename, tablename) from pg_tables where schemaname = 'public' union all select 'select ''auth.users '' || count(*) from auth.users;' order by 1"
          psql "$OLD_DB_URL" -v ON_ERROR_STOP=1 -Atc "$q" > count.sql
          psql "$OLD_DB_URL" -v ON_ERROR_STOP=1 -At -f count.sql > old.txt
          psql "$NEW_DB_URL" -v ON_ERROR_STOP=1 -At -f count.sql > new.txt
          cat new.txt
          diff old.txt new.txt && echo "Every table has the same number of rows in both projects."
