services:
  fets-tv:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_DEFAULT_CENTER_ID: ${NEXT_PUBLIC_DEFAULT_CENTER_ID}
        NEXT_PUBLIC_DEFAULT_EXAM_SESSION_ID: ${NEXT_PUBLIC_DEFAULT_EXAM_SESSION_ID}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_DEFAULT_CENTER_ID: ${NEXT_PUBLIC_DEFAULT_CENTER_ID}
      NEXT_PUBLIC_DEFAULT_EXAM_SESSION_ID: ${NEXT_PUBLIC_DEFAULT_EXAM_SESSION_ID}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik-q73c_default}"
      traefik.http.routers.fets-tv.rule: "Host(`fets.online`) && PathPrefix(`/tv`)"
      traefik.http.services.fets-tv.loadbalancer.server.port: "3000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-q73c_default}
